name: Benchmark

on:
  pull_request:
    branches: ['*']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          load: true
          tags: binwalk-ng:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run benchmarks
        run: |
          # seccomp=unconfined lets gungraun disable ASLR (setarch) in the container.
          docker run --rm --security-opt seccomp=unconfined \
            -v "${{ github.workspace }}:/tmp/binwalk" -w /tmp/binwalk \
            binwalk-ng:dev \
            python3 scripts/bench-run.py

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            target/bench/results.json
            target/bench/bench.log
          if-no-files-found: error

  update-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: target/bench
      - name: Update baseline
        run: bash .github/scripts/update-baseline.sh

  report:
    if: github.event_name == 'pull_request'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: target/bench
      - name: Compare against baseline
        env:
          COMPARE_JSON: target/bench/workdir/compare.json
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/bench-report.sh
      - name: Comment results on PR
        # Fork PRs can't be commented on from a `pull_request` run: GITHUB_TOKEN is
        # read-only there, so the API call would 403 and fail the job.
        if: github.event.pull_request.head.repo.full_name == github.repository && hashFiles('target/bench/workdir/compare.json') != ''
        uses: actions/github-script@v9
        with:
          script: |
            const postComment = require('./.github/scripts/post-bench-comment.js');
            await postComment({ github, context });
      - name: Fail on regressions
        if: hashFiles('target/bench/workdir/compare.json') != ''
        run: bash .github/scripts/fail-on-regressions.sh
